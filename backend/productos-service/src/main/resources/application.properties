spring.application.name=productos-service
server.port=8081

# Base de datos H2 en archivo (persistente entre reinicios). Consola: http://localhost:8081/h2-console
spring.datasource.url=jdbc:h2:file:./data/productosdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
