spring.application.name=movimientos-service
server.port=8082

# Base de datos H2 en archivo (persistente entre reinicios). Consola: http://localhost:8082/h2-console
spring.datasource.url=jdbc:h2:file:./data/movimientosdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ubicación del microservicio de insumos (se consulta para validar y ajustar el stock)
productos.service.url=http://localhost:8081
